name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The geometry, clustering, classification and scoring tests use only the
      # standard library: no dataset, no PyTorch, no OpenCV.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
