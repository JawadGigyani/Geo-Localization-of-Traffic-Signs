name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The geometry, clustering, classification and scoring tests use only the
      # standard library: no dataset, no PyTorch, no OpenCV.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
